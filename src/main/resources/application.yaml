spring:
  datasource:
    url: jdbc:h2:mem:pokemon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus

external:
  timeout:
    connect: 10s
    read: 10s
  poke-api:
    url: "https://pokeapi.co/api/v2"
